<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio Bree</title>
    <style>
        body{
            background-color: #050a18;
            display: flex;
            justify-content: center;
           align-items: center;
           min-height: 100vh;
           margin:0;
           font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

        }
        .profile-card{
            width: 300px; /* Atur lebar kartu */
             background: rgba(255, 255, 255, 0.05); 
             backdrop-filter: blur(15px);
             border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden; /* Biar cover nggak keluar dari border radius */
            padding-bottom: 30px; /* Jarak bawah biar gak sesek */
    /* min-height: 450px; */
             display: flex;
             flex-direction: column;
             border: 1px solid(225,225,225 0.1);
        }
        .header{
            position: relative;
            width:100%;
            height: 100px;
        }
        .cover{
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #00d2ff, #3a7bd5); /* Warna cover */
            border-radius: 20px 20px 0 0; /* Biar ujung atasnya melengkung */
            overflow: hidden;
            border-radius: 20px 20px 0 0;
        }
        .profil-img{
            width:100px;
            height:100px;
            border-radius:50%;
            border:5px rgba(255, 255, 255, 0.1);
            position:absolute;
            bottom:-50px;
            left:50%;
            transform: translateX(-50%);
            box-shadow: 0 0 15px #00d2ff;
            object-fit: cover;
            background:linear-gradient(45deg, #00d2ff, #3a7bd5);
        }
        .stats{
            display: flex; /* Biar berjejer ke samping */
    justify-content: space-around; /* Biar jarak antar item rata */
    padding: 20px;
    margin-top: 10px;
    border-top: 1px solid rgba(255, 255, 255, 0.1); /* Garis pembatas tipis */
            }
            .item{
                text-align: center;
            }
            .item h4 {
    color: #00d2ff; /* Warna angka biar nyala */
    margin: 0;
    font-size: 1.2rem;
    font-weight: bold;
}
.item p {
    color: #ccc; /* Warna teks keterangan agak abu terang */
    margin: 0;
    font-size: 0.8rem;
}
.content{
    margin-top:50px;
    text-align: center;

}
.content h2{
    /* margin: 10px 0 5px 0; */
    margin-top: 20px;
    margin-bottom: 10px;
}
.content p{
    color: #00d2ff; /* Warna title dibedain dikit biar keren */
    font-weight: 500;   
}
span{
    color:#00d2ff;
}
.cta-buttons{
    padding: 8px 20px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
    font-weight: 600;
    transition: 0.3s;
    display: flex;
    justify-content: center;
    gap: 10px; /* Jarak antar tombol */
    margin-bottom: 25px;
    transition: 0.3s ease;
}
.btn-primary{
    background: rgba(255, 255, 255, 0.1);
    color: white;
    border: 1px solid rgba(255, 255, 255, 0.2) !important;
}
.btn-secondary{
    background: #00d2ff;
    color: #050a18;
}
button:hover {
    transform: translateY(-3px);
    box-shadow: 0 5px 15px rgba(0, 210, 255, 0.3);
    transform: scale(1.05); /* Membesar dikit */
    filter: brightness(1.2); /* Makin terang */
}
.container{
    box-shadow: 0 0 15px #3a7bd5;
    border-color: #3a7bd5;
    overflow: hidden;
    background-clip: padding-box;
    border-radius: 22px 22px 20px 20px;
    
}
h2{
    color: #fbfbfb;
    margin-bottom: 10px;
}
        
            

       
    </style>

</head>
<body>
    <div class="container">
        <div class="profile-card">
                <div class="header">
                     <div class="cover"><img src="bree.png" class="profil-img"></div>
                     <div class="profile-pic"></div>
                </div>

                <div class="content">
                 <h2>I am <span>Bree</span></h2>
                 <P>Fullstack Engineer</P>
                </div>
                <div class="stats">
                    <div class="item"><h4>12</h4><p>Projects</p></div>
                    <div class="item"><h4>1.2k</h4><p>Followers</p></div>
                    <div class="item"><h4>6</h4><p>Days Streak</p></div>
                 </div>

                <div class="cta-buttons">
                    <button class="btn-primary">Message</button>
                    <button class="btn-secondary">Follow</button>
                </div>
        </div>
    </div>
   <script>
    const btnMsg = document.querySelector('.btn-primary');
    const btnFollow = document.querySelector('.btn-secondary');
    // Kita buat tempat pesan otomatis
    const contentArea = document.querySelector('.content p');

    btnFollow.addEventListener('click', function() {
        if (this.innerText === "Follow") {
            this.innerText = "Following";
            this.style.background = "#222";
            this.style.color = "#00d2ff";
            this.style.border = "1px solid #00d2ff";
            contentArea.innerText = "Thanks for following! 🔥"; // Pesan gantiin title
        } else {
            this.innerText = "Follow";
            this.style.background = "#00d2ff";
            this.style.color = "#050a18";
            contentArea.innerText = "Fullstack Engineer"; // Balik ke semula
        }
    });

    btnMsg.addEventListener('click', () => {
        contentArea.innerText = "📩 Message Sent to Bree!";
        setTimeout(() => {
            contentArea.innerText = "Fullstack Engineer";
        }, 2000); // Pesan ilang setelah 2 detik
    });
</script>
</body>
</html>
