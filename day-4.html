<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PORTFOLIO BREE</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root{
            --dark-bg: #0b111e;
            --accent-blue: #4facfe;
            --glow-color: rgba(79, 172, 254, 0.3);


        }
        body{
            background-color: var(--dark-bg) ;
            color:white;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            min-height: 100vh;
            margin:0;
            font-family: 'poppins', sans-serif;
        }
        .glow-bg{
            position: absolute;
            width: 400px;
            height:400px;
            background: radial-gradient(circle, var(--glow-color) 0% );
            z-index: -1;
            top:20%;
            border-radius: 80%;
            filter:blur(50px);
            

        }
        .side-nav{
            display:flex;
            left:40px;
            top:50%;
            flex-direction: column;
            position: fixed;
            gap:20px;
            padding: 30px 10px;
            transform: translateY(-50%);
            background: rgba (225,225,225,0.03);
            border:1px solid rgba(225,225,225, 0,1);
            box-shadow: 0 0 20px ;
            border-radius: 20px;
        }
        .nav-item{
            width:50px;
            height:50px;
            display:flex;
            justify-content: center;
            align-items: center;
            border-radius:50% ;
            cursor: pointer;
            font-size:1.5rem;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.5);
            transition: 0.3s;
        }
        .nav-item.active{
            background:var(--accent-blue);
            color: var(--dark-bg);
            box-shadow: 0 0 15px var(--accent-blue);
        }
        .nav-item:hover :not(.active){
            background: rgba(225,225,225, 0,1);
            color:white;
            transform:scale(1.5)
        }
        .container{
            max-width: 800px;
            text-align: center;
            position: relative;
        }
        .profil-img{
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid var(--accent-blue);
            box-shadow: 0 0 20px solid var(--accent-blue);
            margin-bottom: 30px;
            object-fit: cover;
            position: absolute;
            inset: 0 0 10px var(--accent-blue);
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        h1{
            font-size: 3.5rem;
            margin:0;
        }
        h1 span{
            color:var(--accent-blue)
        }
        .role{
            font-size: 1.5rem;
            color:rgba(225,225,225, 0,7);
            margin-bottom:20px;
        }
        .btn-group{
            margin-top: 40;
            display: flex;
            justify-content: center;
            gap: 20px;
            
        }
        .btn{
            padding: 12px 30px;
            border-radius: 20px;
            text-decoration: none;
            font-weight:600;
            transition: 0.3s;

        }

        .btn-primary{
            background: linear-gradient(to right,#4facfe 0%, #00f2fe 100%);
            color:#0b111e
            
        }
        .btn-secondary{
            border:1px solid white;
            color:white;
        }

        .btn:hover{
            transform: translateY(-5px);
        }
        


    </style>
    
</head>
<body>
    

    <nav class="side-nav">
        <div class="nav-item active">
            <a href="#"><span  class="icon">🏠</span></a>
        </div>
        <div class="nav-item">
            <a href="#"><span class="icon">💼</span></a>
        </div>
        <div class="nav-item">
            <a href="#"><span class="icon">🎓</span></a>
        </div>
        <div class="nav-item">
           <a href="#"><span class="icon">📁</span></a>
        </div>
        
    </nav>

    <div class="glow-bg"></div>
    <div class="container">
        
        <img src="ran.png" class="profile-img">
        <h1>Hi I am <span>Bree</span></h1>
        <p class="role">I'm Fullstack Engineer in-Training</p>
        <p>I create beautiful, responsive web experiences using modern technologies.<br>
        Passionate about clean code and user-centered design</p>
    
         <div class="btn-group">
        <a href="#" class="btn btn-primary">View My Work</a>
        <a href="#" class="btn btn-secondary">Download CV</a>
         </div>
    </div>
</body>
</html>
